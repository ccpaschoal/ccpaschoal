name: Cobrinha e estatísticas

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gerar a cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF2B1C&color_dots=#EBEDF0,#F5EDEA,#FF6A45,#E0442C,#5A0A06
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF6A45&color_dots=#161B22,#3A0603,#5A0A06,#B3120A,#F5EDEA

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar as estatísticas
        run: node .github/scripts/stats.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
