name: Cobrinha e estatísticas

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gerar a cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#8B1E2D&color_dots=#EBEDF0,#F1E6C8,#D9B65C,#4A7BA7,#0F2A40
            dist/snake-dark.svg?palette=github-dark&color_snake=#D9B65C&color_dots=#161B22,#1A3A52,#2C5282,#6BA3D8,#F1E6C8

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar as estatísticas
        run: node .github/scripts/stats.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
