<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2A40"/>
      <stop offset="0.6" stop-color="#1A3A52"/>
      <stop offset="1" stop-color="#2C5282"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E1622"/>
      <stop offset="1" stop-color="#8B1E2D"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F1E6C8"/>
      <stop offset="0.45" stop-color="#F1E6C8"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F1E6C8"/>
      <stop offset="1" stop-color="#F1E6C8"/>
      <animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6BA3D8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6BA3D8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .name{font:800 76px 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:1px}
    .sub{font:600 22px 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#D9B65C;letter-spacing:6px}
    .tag{font:500 16px 'Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#D9DEE4;letter-spacing:2px}
    .in{animation:up 1s cubic-bezier(.22,1,.36,1) backwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}
    @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .star{animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    .float{animation:fl 7s ease-in-out infinite}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle class="float" cx="980" cy="90" r="190" fill="url(#glow)"/>
  <circle class="float" cx="180" cy="230" r="150" fill="url(#glow)" style="animation-delay:-3s"/>

  <!-- brilhos -->
  <g fill="#D9B65C">
    <circle class="star" cx="120" cy="60" r="2.5"/>
    <circle class="star" cx="260" cy="110" r="1.8" style="animation-delay:.8s"/>
    <circle class="star" cx="1050" cy="70" r="2.2" style="animation-delay:1.4s"/>
    <circle class="star" cx="930" cy="160" r="1.6" style="animation-delay:2.1s"/>
    <circle class="star" cx="1120" cy="190" r="2.4" style="animation-delay:.4s"/>
    <circle class="star" cx="80" cy="170" r="1.6" style="animation-delay:1.8s"/>
    <circle class="star" cx="760" cy="48" r="1.8" style="animation-delay:2.6s"/>
    <circle class="star" cx="420" cy="40" r="1.6" style="animation-delay:1.1s"/>
  </g>
  <g fill="#F1E6C8">
    <path class="star" d="M1000 120 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" style="animation-delay:.6s"/>
    <path class="star" d="M190 80 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" style="animation-delay:1.9s"/>
  </g>

  <!-- ondas -->
  <path fill="#2C5282" opacity="0.55">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0 255 C200 225 400 285 600 255 C800 225 1000 285 1200 255 V320 H0Z;
              M0 255 C200 285 400 225 600 255 C800 285 1000 225 1200 255 V320 H0Z;
              M0 255 C200 225 400 285 600 255 C800 225 1000 285 1200 255 V320 H0Z"/>
  </path>
  <path fill="url(#wine)" opacity="0.9">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 280 C250 300 450 255 700 280 C900 300 1050 265 1200 280 V320 H0Z;
              M0 280 C250 260 450 305 700 280 C900 260 1050 300 1200 280 V320 H0Z;
              M0 280 C250 300 450 255 700 280 C900 300 1050 265 1200 280 V320 H0Z"/>
  </path>

  <text x="600" y="78" text-anchor="middle" class="tag in">OLÁ, EU SOU A</text>
  <text x="600" y="158" text-anchor="middle" class="name in d1" fill="url(#shine)">Camilla Paschoal</text>
  <rect x="540" y="180" width="120" height="3" rx="1.5" fill="#8B1E2D" class="in d2"/>
  <text x="600" y="220" text-anchor="middle" class="sub in d3">SOCIAL MEDIA · WEB DESIGN</text>
</svg>
